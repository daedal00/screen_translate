name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100
        with:
          components: clippy, rustfmt
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-core-no-tauri.sh
        shell: bash
      # Packaging is slow (fat-LTO release builds): run it on main and manual runs, and on PRs that touch it.
      - name: Decide whether to package
        id: pkg
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != pull_request ] \
            || git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(packaging/|crates/app/(build\.rs|icon\.rc|app\.manifest|Cargo\.toml)|Cargo\.(toml|lock)|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package the macOS app (unsigned updater artifacts)
        if: runner.os == 'macOS' && steps.pkg.outputs.run == 'true'
        run: |
          packaging/macos/bundle.sh 0.0.0-ci
          out="target/bundle"
          app="$out/Screen Translate.app"
          tar -tzf "$out/Screen.Translate_universal.app.tar.gz" | grep -qv '^Screen Translate.app/' && exit 1
          tar -tzf "$out/Screen.Translate_universal.app.tar.gz" | grep -q '^Screen Translate.app/Contents/Info.plist$'
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = screen-translate
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = 0.0.0-ci
          lipo -archs "$app/Contents/MacOS/screen-translate" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/screen-translate" | grep -q x86_64
      - name: Build the Windows installer
        if: runner.os == 'Windows' && steps.pkg.outputs.run == 'true'
        shell: pwsh
        run: |
          cargo build --release -p screen-translate
          # Show the embedded manifest: it must exist once (PerMonitorV2); a duplicate fails the link (CVT1100).
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -inputresource:"target\release\screen-translate.exe;#1" -out:target\exe.manifest
          if ($LASTEXITCODE -ne 0) { throw "no manifest embedded in the exe" }
          Get-Content target\exe.manifest
          if (-not (Select-String -Path target\exe.manifest -Pattern 'PerMonitorV2' -Quiet)) { throw "manifest lacks PerMonitorV2" }
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          New-Item -ItemType Directory -Force target\bundle | Out-Null
          & "$nsis\makensis.exe" "/DVERSION=0.0.0-ci" "/DSRC=$PWD\target\release\screen-translate.exe" "/DOUTFILE=$PWD\target\bundle\setup.exe" packaging\windows\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
