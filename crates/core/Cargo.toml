[package]
name = "screen-translate-core"
version = "0.4.0"
description = "UI-agnostic core of Screen Translate: capture, OCR, translation, local model manager"
authors = ["samuel"]
license = "MIT"
edition = "2024"

[lib]
name = "screen_translate_core"

[dependencies]
log = "0.4"
xcap = { version = "0.9.10", default-features = false, features = ["wgc"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
# SHA-256 verification of downloaded llama.cpp archives.
sha2 = "0.11"
# Parallel range downloads: FuturesUnordered and the cancel/progress tick.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["time", "rt"] }
minisign-verify = "0.3"
semver = "1"
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
libc = "0.2"
objc2 = "0.6.5"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"
tar = "0.4"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"
