<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translation</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #d8d8d8; --accent: #2b6cff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #232326; --fg: #f1f1f1; --muted: #9a9a9f; --line: #3a3a3f; --accent: #6b9bff; } }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 14px; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; border: 1px solid var(--line); }
      #content { flex: 1; overflow-y: auto; }
      #translation { font-size: 18px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
      #original { margin-top: 10px; font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
      #error { color: #d33; }
      #bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
      #source { flex: 1; }
      button { font: inherit; padding: 3px 10px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      [hidden] { display: none !important; }
    </style>
    <script type="module" src="/src/popup.ts" defer></script>
  </head>
  <body>
    <div id="content">
      <div id="translation">Translating...</div>
      <div id="error" hidden></div>
      <div id="original"></div>
    </div>
    <div id="bar">
      <span id="source"></span>
      <button id="settings" hidden>Settings</button>
      <button id="copy" hidden>Copy</button>
      <button id="close">Close</button>
    </div>
  </body>
</html>
