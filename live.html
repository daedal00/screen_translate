<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live translation</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; pointer-events: none; user-select: none; }
      .line { position: absolute; box-sizing: border-box; padding: 0 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: #1c1c1e; color: #f5f5f5; font-family: system-ui, sans-serif; }
      #error { position: absolute; top: 4px; left: 4px; max-width: calc(100% - 8px); padding: 2px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: #1c1c1e; color: #ff7b72; font: 12px/16px system-ui, sans-serif; border-radius: 3px; }
      [hidden] { display: none !important; }
    </style>
    <script type="module" src="/src/live.ts" defer></script>
  </head>
  <body>
    <div id="lines"></div>
    <div id="error" hidden></div>
  </body>
</html>
