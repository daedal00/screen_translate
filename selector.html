<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select region</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: transparent; }
      #dim { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); animation: fade 120ms ease-out; }
      #box { position: fixed; display: none; box-sizing: border-box; border: 1px solid #fff; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.35); }
      #size { position: absolute; right: -1px; top: calc(100% + 4px); padding: 1px 6px; font: 11px/16px system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, 0.75); border-radius: 3px; white-space: nowrap; }
      #size.inside { top: auto; bottom: 4px; right: 4px; }
      /* Starts at 0.01, not 0: a fully transparent layer lets macOS click through. */
      @keyframes fade { from { opacity: 0.01; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
    <script type="module" src="/src/selector.ts" defer></script>
  </head>
  <body>
    <div id="dim"></div>
    <div id="box"><span id="size"></span></div>
  </body>
</html>
